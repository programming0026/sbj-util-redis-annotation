name: CI

# Compila y ejecuta las pruebas en cada push a main, en los pull requests y a mano.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Librería y ejemplo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: sbj-util-redis-*/pom.xml
      - name: Compilar, probar e instalar la librería
        working-directory: sbj-util-redis
        run: mvn -B -ntp install
      - name: Compilar y probar el ejemplo (usa la librería instalada)
        working-directory: sbj-util-redis-example
        run: mvn -B -ntp verify
