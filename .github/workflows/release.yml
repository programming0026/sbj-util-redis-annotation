name: Release

on:
  push:
    tags: ['sbj-util-redis-annotation-v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG_PREFIX: sbj-util-redis-annotation-v

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check tag matches pom version
        working-directory: sbj-util-redis
        run: |
          POM_VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          TAG_VERSION="${GITHUB_REF_NAME#"${TAG_PREFIX}"}"
          if [ "${TAG_VERSION}" != "${POM_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pom version ${POM_VERSION} (expected ${TAG_PREFIX}${POM_VERSION})"
            exit 1
          fi
          case "${POM_VERSION}" in
            *-SNAPSHOT)
              echo "::error::SNAPSHOT versions cannot be released to Maven Central (${POM_VERSION})"
              exit 1
              ;;
          esac
          echo "Releasing version ${POM_VERSION}"

      - name: Deploy
        working-directory: sbj-util-redis
        run: mvn -B -ntp -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
